name: setup-clang
description: >
  clang-<version> from apt.llvm.org, plus libomp (omp.h and the host
  OpenMP runtime) for -fopenmp. The compiler is clang++-<version>.
inputs:
  version:
    description: clang major version
    # 22: the first release that fully supports CUDA 12.6 (setup-cuda's
    # default); 20 and 21 stop at 12.3 and warn, which -Werror rejects.
    default: '22'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        wget -q https://apt.llvm.org/llvm.sh
        sudo bash llvm.sh "${{ inputs.version }}"
        sudo apt-get install -y libomp-${{ inputs.version }}-dev
