name: gpu-registers

# Register / spill / stack usage of every CUDA test kernel, compared with
# the base. No GPU needed: clang compiles the tests device-only to PTX and
# ptxas (which does the register allocation) reports per kernel. See
# .github/scripts/register_report.py.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registers:
    name: CUDA registers non-regression
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash # -eo pipefail, so `| tee` keeps the script's exit code
    env:
      # Pinned: register counts move with the compiler and ptxas versions.
      LLVM_VERSION: 20
      CUDA_VERSION: 12-6
      CUDA_PATH: /usr/local/cuda-12.6
      CUDA_ARCH: sm_80
      CXX: clang++-20
      # A file's max registers may grow by this much before failing; any
      # growth in spill bytes fails.
      REG_SLACK_PCT: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install clang + CUDA (headers, libdevice, ptxas)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          # libcurand-dev: clang's __clang_cuda_runtime_wrapper.h includes
          # curand_mtgp32_kernel.h.
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-$CUDA_VERSION cuda-cudart-dev-$CUDA_VERSION \
            libcurand-dev-$CUDA_VERSION
          $CXX --version | head -1
          "$CUDA_PATH/bin/ptxas" --version | tail -1
      - name: Fetch {fmt}
        # Host side of the tests only; the same headers serve base and head.
        run: make third_party/fmt/include/fmt/format.h
      - name: Pick base ref
        id: base
        run: |
          # Same rule as the coverage job: PRs compare against the merge base,
          # pushes against origin/main.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi
      - name: Measure base
        run: |
          git worktree add ../base ${{ steps.base.outputs.ref }}
          FMT_INCLUDE=$PWD/third_party/fmt/include \
            python3 .github/scripts/register_report.py measure ../base base.json
      - name: Measure this branch
        run: |
          FMT_INCLUDE=$PWD/third_party/fmt/include \
            python3 .github/scripts/register_report.py measure . head.json
      - name: Compare
        run: |
          python3 .github/scripts/register_report.py compare base.json head.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-registers
          path: |
            base.json
            head.json
