name: test

# Every id of test/configs.json that a GitHub runner can run, each through
# test/run_id.sh. test/check_id.py then compares the id's results with its
# expected failures and decides pass or fail, so run_id.sh's own exit status
# (non-zero whenever any test fails, expected or not) is ignored.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix:
    # Builds the matrix below with each id's notes from test/configs.json,
    # so the job names say what each id is (a name cannot read a file).
    # ubuntu: host references (0 specifiers path, 1 buffer path), fast-math
    # (12, 13), ASan+UBSan with g++ and clang++ at -O0 and -O2 (24-31), C++23
    # (43). Then the GPU routes, built but not run as there is no GPU here:
    # clang-22 CUDA (36), clang-22 OpenMP NVPTX -O0/-O2 (37, 38, compile
    # only), icpx SYCL and OpenMP ahead-of-time for PVC -O0/-O2 (39-42).
    # Their setup scripts install their own toolchains.
    # macos: Apple clang with libc++ (32 specifiers path, 33 buffer path).
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.m.outputs.ids }}
    steps:
      - uses: actions/checkout@v6
      - id: m
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          notes = {r["id"]: r["notes"] for r in json.load(open("test/configs.json"))}
          def ids(os, goal, *l): return [{"id": i, "os": os, "goal": goal, "notes": notes[i]} for i in l]
          print("ids=" + json.dumps(ids("ubuntu-24.04", "test", 0, 1, 12, 13, 24, 25, 26, 27, 28, 29, 30, 31, 43)
                                    + ids("ubuntu-24.04", "build", 36, 37, 38, 39, 40, 41, 42)
                                    + ids("macos-latest", "test", 32, 33)))
          EOF

  id:
    needs: matrix
    name: id ${{ matrix.id }} (${{ matrix.notes }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.ids) }}
    steps:
      - uses: actions/checkout@v6
      # GNU Make from Homebrew: macOS's is 3.81, which ignores .SHELLFLAGS, so
      # pipefail would be lost and tee would hide failures.
      - if: runner.os == 'macOS'
        run: |
          brew install make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
      - run: test/run_id.sh ${{ matrix.id }} ${{ matrix.goal }} || true
      - run: python3 test/check_id.py ${{ matrix.id }} ${{ matrix.goal }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: summary-${{ matrix.id }}
          path: results/id-${{ matrix.id }}/summary.md
          # The summary job reports a missing row itself.
          if-no-files-found: ignore

  summary:
    # One table of every id on the run's summary page, from the row each id
    # job's check_id.py wrote. An id with no row did not get that far.
    needs: [matrix, id]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: summary-*
      - env:
          IDS: ${{ needs.matrix.outputs.ids }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, os
          print("| id | config | result |\n|---|---|---|")
          for r in json.loads(os.environ["IDS"]):
              f = "summary-%d/summary.md" % r["id"]
              print(open(f).read().strip() if os.path.exists(f) else
                    "| ⚠️ %d | %s | no result: check_id.py did not run |" % (r["id"], r["notes"]))
          EOF

  readme:
    # Every whole program in README.md is a copy of a file in examples/,
    # which the ids above build and run (FFMT_EXTRA_FILES).
    name: README examples match examples/
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 test/check_readme.py

  coverage:
    # Region coverage of base.hpp, as the union over the coverage ids' binaries
    # (34 specifiers path, 35 buffer path; main and isolated binaries both),
    # must not drop against the base branch.
    name: coverage non-regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Need the base branch for the comparison build.
          fetch-depth: 0
      - name: Install llvm
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Pick base ref
        id: base
        run: |
          # PR runs compare against the merge base. Pushes fall back to
          # comparing against origin/main so direct pushes are still gated.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi
      - name: Coverage on base
        run: |
          git worktree add ../base ${{ steps.base.outputs.ref }}
          cd ../base
          if [ -x test/run_id.sh ]; then
            test/run_id.sh 34 build || true
            test/run_id.sh 35 build || true
            mapfile -t BINS < <(find build/id-34 build/id-35 -type f -executable \( -name test -o -path '*/isolated/*' \))
          else
            # A base that predates test/run_id.sh: the old Makefile's build.
            make CXX=clang++ -j$(nproc) coverage
            mapfile -t BINS < <(find build -maxdepth 1 -type f -executable -name 'cov_*')
          fi
          # This branch's copy of the script, so base and head are measured
          # the same way.
          python3 "$GITHUB_WORKSPACE/.github/scripts/coverage_union.py" \
            "$(clang++ -print-prog-name=llvm-cov)" "$(clang++ -print-prog-name=llvm-profdata)" \
            include/ffmt/base.hpp "${BINS[@]}" > "$GITHUB_WORKSPACE/base.txt"
      - name: Coverage on this branch
        run: |
          test/run_id.sh 34 build || true
          test/run_id.sh 35 build || true
          mapfile -t BINS < <(find build/id-34 build/id-35 -type f -executable \( -name test -o -path '*/isolated/*' \))
          python3 .github/scripts/coverage_union.py \
            "$(clang++ -print-prog-name=llvm-cov)" "$(clang++ -print-prog-name=llvm-profdata)" \
            include/ffmt/base.hpp "${BINS[@]}" > head.txt
      - name: Compare
        run: |
          # Union over the coverage binaries (see coverage_union.py): a
          # region counts as covered if any binary covers it.
          base=$(cat base.txt)
          head=$(cat head.txt)
          printf 'Regions coverage — base: %.4f%%  head: %.4f%%\n' "$base" "$head"
          # 0.01pp slack: identical builds occasionally wobble at the 5th
          # decimal. A real regression moves the number by much more.
          awk -v b="$base" -v h="$head" \
            'BEGIN { if (h+0 < b+0 - 0.01) { printf("FAIL: %.4f%% < base %.4f%% (drop)\n", h, b); exit 1 } }'
