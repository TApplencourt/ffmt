name: test

# Every id of test/configs.json that a GitHub runner can run, each through
# test/run_id.sh, which only records what happens. test/check_id.py then
# compares the id's results with what test/configs.json expects and decides
# pass or fail.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix:
    # The ids of test/configs.json whose `ci` is github:<runner>, with their
    # notes, so the job names say what each id is (a name cannot read a
    # file). `goal` is build for the GPU routes, as there is no GPU here.
    # ids (goal test) go to the id job; resource_jobs to the resources job:
    # a head and a base job for each id of goal build (the GPU ids, all at
    # -O2: register and memory use only matter where the code is optimized).
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.m.outputs.ids }}
      resource_jobs: ${{ steps.m.outputs.resource_jobs }}
    steps:
      - uses: actions/checkout@v6
      - id: m
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          rows = [
              {"id": r["id"], "os": r["ci"].split(":")[1], "goal": r.get("goal", "test"), "notes": r["notes"]}
              for r in json.load(open("test/configs.json")) if r.get("ci", "").startswith("github:")]
          print("ids=" + json.dumps([r for r in rows if r["goal"] == "test"]))
          print("resource_jobs=" + json.dumps(
              [{**r, "side": side} for r in rows if r["goal"] == "build" for side in ("head", "base")]))
          EOF

  id:
    needs: matrix
    name: id ${{ matrix.id }} (${{ matrix.notes }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.ids) }}
    steps:
      # The pull request's own commit, not the merge commit GitHub makes for
      # it: config.txt records the commit tested, and an accept
      # (--accept-and-update-config) takes only results of a commit of the
      # branch.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # GNU Make from Homebrew: macOS's is 3.81, which ignores .SHELLFLAGS, so
      # pipefail would be lost and tee would hide failures.
      - if: runner.os == 'macOS'
        run: |
          brew install make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
      - run: test/run_id.sh ${{ matrix.id }} ${{ matrix.goal }}
      - run: python3 test/check_id.py ${{ matrix.id }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          # The id's logs, named so that `gh run download <run> --dir results`
          # puts them where test/check_id.py reads them, to review a run and
          # accept it locally (--accept-and-update-config).
          name: id-${{ matrix.id }}
          path: results/id-${{ matrix.id }}/
          # The summary job reports a missing row itself.
          if-no-files-found: ignore

  summary:
    # One table of every id on the run's summary page, from the row each id
    # job's check_id.py wrote. An id with no row did not get that far.
    needs: [matrix, id, resources]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: id-*
          path: results
      - env:
          IDS: ${{ needs.matrix.outputs.ids }}
          RESOURCE_JOBS: ${{ needs.matrix.outputs.resource_jobs }}
        run: |
          python3 test/check_id.py --table $(jq -r '.[].id' <<< "$IDS") \
            $(jq -r '.[] | select(.side == "head") | .id' <<< "$RESOURCE_JOBS") \
            >> "$GITHUB_STEP_SUMMARY" || true

  resources:
    # The build-only GPU ids (goal build): head builds and checks the id
    # like the id job (same artifact). Both sides then read, with this
    # branch's test/resource_usage.py, what the compiler said of each test
    # kernel in that build (registers, stack or scratch, spills, shared
    # memory; FFMT_TEST_FLAGS in the setup). head is the pull request's
    # commit; base its base, or the previous commit for a push.
    # resources-summary compares.
    needs: matrix
    name: id ${{ matrix.id }} (${{ matrix.notes }}), ${{ matrix.side }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.resource_jobs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # Id 84's ROCm 10.1.0 wheels (about 4 GB), which setup_84.sh installs
      # only when missing.
      - if: matrix.id == 84
        uses: actions/cache@v4
        with:
          path: ~/rocm-10.1.0
          key: rocm-10.1.0-wheels
      - if: matrix.side == 'head'
        run: test/run_id.sh ${{ matrix.id }} ${{ matrix.goal }}
      # The base is built the same way, by its own test/run_id.sh, when it
      # has the id; this branch's script reads both builds.
      - if: matrix.side == 'base'
        run: |
          base=${{ github.event.pull_request.base.sha }}
          git worktree add ../base "${base:-$(git rev-parse HEAD~1)}"
          cp Makefile.id ../base/Makefile.id
          cd ../base
          if [ -f test/setup/setup_${{ matrix.id }}.sh ]; then test/run_id.sh ${{ matrix.id }} build; fi
      - run: |
          tree=.; [ "${{ matrix.side }}" = base ] && tree=../base
          test/resource_usage.py measure ${{ matrix.id }} \
            "resources/${{ matrix.side }}/id-${{ matrix.id }}.json" --tree "$tree"
      - uses: actions/upload-artifact@v7
        with:
          name: resources-${{ matrix.id }}-${{ matrix.side }}
          path: resources/
      - if: matrix.side == 'head'
        run: python3 test/check_id.py ${{ matrix.id }}
      - if: always() && matrix.side == 'head'
        uses: actions/upload-artifact@v7
        with:
          name: id-${{ matrix.id }}
          path: results/id-${{ matrix.id }}/
          if-no-files-found: ignore

  resources-summary:
    # One table of every backend, base to head, on the run's summary page.
    # Fails when any number of any test file grew, or a file stopped building.
    name: GPU resources non-regression
    needs: resources
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: resources-*
          path: resources
          merge-multiple: true
      - run: |
          test/resource_usage.py compare resources/base resources/head | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  readme:
    # Every whole program in README.md is a copy of a file in examples/,
    # which the ids above build and run (FFMT_EXTRA_FILES).
    name: README examples match examples/
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 test/check_readme.py

  checker:
    name: unit tests of the test scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s test -p 'test_*.py' -v

  coverage:
    # Region coverage of base.hpp, as the union over the coverage ids' binaries
    # (34 specifiers path, 35 buffer path; every test binary),
    # must not drop against the base branch.
    name: coverage non-regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Need the base branch for the comparison build.
          fetch-depth: 0
      - name: Install llvm
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Pick base ref
        id: base
        run: |
          # PR runs compare against the merge base. Pushes fall back to
          # comparing against origin/main so direct pushes are still gated.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi
      - name: Coverage on base
        run: |
          git worktree add ../base ${{ steps.base.outputs.ref }}
          cd ../base
          if [ -x test/run_id.sh ]; then
            # Test binaries are in build/id-<id>/bin/; a base that predates
            # that has build/id-<id>/test and build/id-<id>/isolated/.
            test/run_id.sh 34 build || true
            test/run_id.sh 35 build || true
            mapfile -t BINS < <(find build/id-34 build/id-35 -type f -executable \( -path '*/bin/*' -o -name test -o -path '*/isolated/*' \))
          else
            # A base that predates test/run_id.sh: the old Makefile's build.
            make CXX=clang++ -j$(nproc) coverage
            mapfile -t BINS < <(find build -maxdepth 1 -type f -executable -name 'cov_*')
          fi
          # This branch's copy of the script, so base and head are measured
          # the same way.
          python3 "$GITHUB_WORKSPACE/.github/scripts/coverage_union.py" \
            "$(clang++ -print-prog-name=llvm-cov)" "$(clang++ -print-prog-name=llvm-profdata)" \
            include/ffmt/base.hpp "${BINS[@]}" > "$GITHUB_WORKSPACE/base.txt"
      - name: Coverage on this branch
        run: |
          test/run_id.sh 34 build || true
          test/run_id.sh 35 build || true
          mapfile -t BINS < <(find build/id-34 build/id-35 -type f -executable \( -path '*/bin/*' -o -name test -o -path '*/isolated/*' \))
          python3 .github/scripts/coverage_union.py \
            "$(clang++ -print-prog-name=llvm-cov)" "$(clang++ -print-prog-name=llvm-profdata)" \
            include/ffmt/base.hpp "${BINS[@]}" > head.txt
      - name: Compare
        run: |
          # Union over the coverage binaries (see coverage_union.py): a
          # region counts as covered if any binary covers it.
          base=$(cat base.txt)
          head=$(cat head.txt)
          printf 'Regions coverage — base: %.4f%%  head: %.4f%%\n' "$base" "$head"
          # 0.01pp slack: identical builds occasionally wobble at the 5th
          # decimal. A real regression moves the number by much more.
          awk -v b="$base" -v h="$head" \
            'BEGIN { if (h+0 < b+0 - 0.01) { printf("FAIL: %.4f%% < base %.4f%% (drop)\n", h, b); exit 1 } }'
