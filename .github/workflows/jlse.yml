name: Dispatch JLSE

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing mirrored GitLab ref
        required: true
        default: main
        type: string
      run_h100:
        description: Run required H100 coverage for all 56 IDs
        required: false
        default: false
        type: boolean

permissions:
  contents: none
  pull-requests: write  # to link the pipeline on the PR of the ref

jobs:
  dispatch:
    name: Submit GitLab pipeline
    runs-on: ubuntu-latest
    environment: jlse
    steps:
      - name: Request trigger pipeline
        id: submit
        env:
          GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
          GITLAB_REF: ${{ inputs.ref }}
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          RUN_H100: ${{ inputs.run_h100 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GITLAB_TRIGGER_TOKEN:?A Maintainer must add GITLAB_TRIGGER_TOKEN to the protected jlse Environment}"
          : "${GITLAB_PROJECT_ID:?Configure the non-secret GITLAB_PROJECT_ID Actions variable}"
          response_file=$(mktemp)
          headers_file=$(mktemp)
          trap 'rm -f "$response_file" "$headers_file"' EXIT
          request=(
            --request POST
            --silent --show-error
            --connect-timeout 15 --max-time 60
            --output "$response_file"
            --dump-header "$headers_file"
            --write-out '%{http_code}'
            --form-string "token=${GITLAB_TRIGGER_TOKEN}"
            --form-string "ref=${GITLAB_REF}"
          )
          if [ "$RUN_H100" = true ]; then
            request+=(--form-string "variables[RUN_H100]=true")
          fi
          set +e
          http_code=$(curl "${request[@]}" \
            "https://gitlab.jlse.anl.gov/api/v4/projects/${GITLAB_PROJECT_ID}/trigger/pipeline"
          )
          curl_status=$?
          set -e
          if [ "$curl_status" -ne 0 ] || [[ ! "$http_code" =~ ^2 ]]; then
            python3 - "$headers_file" "$response_file" "$http_code" "$curl_status" <<'PY'
          import html
          import json
          import os
          import re
          import sys

          def clean(value):
              value = re.sub(r"[\x00-\x1f\x7f]+", " ", value)
              for secret in (os.environ["GITLAB_TRIGGER_TOKEN"],):
                  if secret:
                      value = value.replace(secret, "[redacted]")
              value = re.sub(r"\b(?:glpat|glptt)-[A-Za-z0-9_-]+", "[redacted]", value)
              return re.sub(
                  r"(?i)\b(token|private[-_]token|access[-_]token|authorization)\b(\s*[:=]\s*)(?:bearer\s+)?[^\s,&}\]]+",
                  lambda match: match[1] + match[2] + "[redacted]", value)

          def error_text(value):
              if isinstance(value, str):
                  return [value]
              if isinstance(value, list):
                  return [part for item in value for part in error_text(item)]
              if isinstance(value, dict):
                  return [part for key, item in value.items()
                          if key.lower() not in {"authorization", "headers", "cookies", "password", "secret"}
                          for part in error_text(item)]
              return []

          try:
              with open(sys.argv[2]) as stream:
                  payload = json.load(stream)
              roots = [payload[key] for key in ("message", "error", "base") if key in payload]
              message = "; ".join(dict.fromkeys(clean(part) for root in roots for part in error_text(root)))
          except (OSError, ValueError, TypeError):
              message = ""
          message = message[:2000] if message else "No sanitized GitLab error message available; response body omitted."
          request_ids = []
          try:
              with open(sys.argv[1]) as stream:
                  for line in stream:
                      name, separator, value = line.partition(":")
                      if separator and name.lower() in {"x-request-id", "x-correlation-id", "x-gitlab-request-id"}:
                          value = value.strip()
                          if re.fullmatch(r"[A-Za-z0-9._:/+=-]{1,200}", value):
                              request_ids.append((name.lower(), value))
          except OSError:
              pass
          lines = [f"GitLab trigger request failed: HTTP {sys.argv[3]}, curl status {sys.argv[4]}.",
                   f"Sanitized GitLab error: {message}"]
          lines += [f"GitLab {name}: {value}" for name, value in request_ids]
          print("\n".join(lines), file=sys.stderr)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## JLSE submission failed\n\n")
              summary.write("".join(f"- {html.escape(line)}\n" for line in lines))
          PY
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import html
          import json
          import os
          import sys
          from pathlib import Path

          with open(sys.argv[1]) as stream:
              pipeline = json.load(stream)
          if not isinstance(pipeline.get("id"), int) or not pipeline.get("web_url"):
              raise SystemExit("GitLab response lacks the created pipeline id and web_url")
          url = str(pipeline["web_url"])
          ref = html.escape(os.environ["GITLAB_REF"])
          h100 = "required" if os.environ["RUN_H100"] == "true" else "optional manual"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## JLSE pipeline submitted\n\n")
              summary.write(f"- Pipeline: [{pipeline['id']}]({html.escape(url)})\n")
              summary.write(f"- GitLab ref: `{ref}`\n")
              summary.write(f"- H100: {h100}\n\n")
              summary.write("Submission is asynchronous. Open the pipeline in GitLab for its eventual hardware result; this Action does not poll it.\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"id={pipeline['id']}\nurl={url}\nsha={pipeline.get('sha', '')}\n")
          PY

      # The open PR whose head is the ref gets the pipeline's link, and the
      # commit GitLab took: its mirror can lag behind a push.
      - name: Link the pipeline on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_REF: ${{ inputs.ref }}
          RUN_H100: ${{ inputs.run_h100 }}
          PIPELINE_ID: ${{ steps.submit.outputs.id }}
          PIPELINE_URL: ${{ steps.submit.outputs.url }}
          PIPELINE_SHA: ${{ steps.submit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          read -r pr head < <(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITLAB_REF" \
            --state open --json number,headRefOid --jq '.[0] | "\(.number) \(.headRefOid)"' || true) || true
          if [ -z "${pr:-}" ] || [ "$pr" = null ]; then
            echo "No open pull request has $GITLAB_REF as its head."
            exit 0
          fi
          [ "$RUN_H100" = true ] && h100=required || h100="optional (manual)"
          body="JLSE pipeline [$PIPELINE_ID]($PIPELINE_URL) on \`${PIPELINE_SHA:0:8}\`, H100 $h100."
          if [ "$PIPELINE_SHA" != "$head" ]; then
            body+=" GitLab's mirror is behind this PR's head \`${head:0:8}\`: dispatch again once it has synced."
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$body"
