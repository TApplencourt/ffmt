name: host-tests

on:
  push:
    branches: [main, omp_support]
  pull_request:

jobs:
  matrix:
    name: ${{ matrix.cxx }} ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        sanitizer:
          - ""
          - "-fsanitize=address"
          # `-fno-sanitize=bool`: libstdc++'s std::basic_format_arg uses an
          # _Arg_value union with a `bool _M_bool` member (libstdc++-13
          # bits/format.h around line 2737/2780). `_S_get<bool>` returns a
          # reference to that member, and the union initializes through
          # `_M_none()` so the raw bytes are 0 — which UBSan flags as "load
          # of value 0, which is not a valid value for type 'bool'". The
          # load is in `<format>`, not in our header, so disable just the
          # bool check; the rest of UBSan stays active.
          - "-fsanitize=undefined -fno-sanitize=bool"
          - "-fsanitize=address,undefined -fno-sanitize=bool"
    env:
      CXX: ${{ matrix.cxx }}
      EXTRA_CXXFLAGS: ${{ matrix.sanitizer }}
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: ${{ matrix.cxx }} --version
      - name: Build + run host tests
        run: make -j$(nproc) test-host

  coverage:
    name: coverage non-regression
    runs-on: ubuntu-24.04
    env:
      CXX: clang++
      # Bumping this (or accepting a drop) requires an explicit edit to this
      # file, which is the gate. Regions are the most stable signal across
      # llvm-cov versions; lines/branches are noisier.
      COVERAGE_BASELINE_REGIONS: "91.55"
    steps:
      - uses: actions/checkout@v4
      - name: Install llvm + jq
        run: sudo apt-get update && sudo apt-get install -y llvm jq
      - name: Build + run coverage
        run: make -j$(nproc) coverage-json > coverage.json
      - name: Check non-regression
        run: |
          actual=$(jq -r '.data[0].files[]
                         | select(.filename | endswith("sycl_khx_print.hpp"))
                         | .summary.regions.percent' coverage.json)
          printf 'Regions coverage: %.2f%% (baseline: %s%%)\n' "$actual" "$COVERAGE_BASELINE_REGIONS"
          awk -v a="$actual" -v b="$COVERAGE_BASELINE_REGIONS" \
            'BEGIN { if (a+0 < b+0) { printf("FAIL: %.2f%% < baseline %.2f%%\n", a, b); exit 1 } }'
