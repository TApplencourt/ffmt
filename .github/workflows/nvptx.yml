name: nvptx

# Build the full test suite for NVIDIA GPUs with every supported NVPTX
# route (README support table), so a header change that breaks device
# compilation fails here. Compile and link only: there is no GPU to run on.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang CUDA
            target: build/test_main_cuda
            make-args: USE_CUDA_CLANG=1
          - name: clang OpenMP offload -O0
            target: build/test_main_omp
            make-args: USE_OMP_CLANG=1 OMP_OPT=-O0
          - name: clang OpenMP offload -O2
            target: build/test_main_omp
            make-args: USE_OMP_CLANG=1 OMP_OPT=-O2
    env:
      LLVM_VERSION: 20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v6
      - name: Install clang (with the OpenMP offload runtime)
        run: wget -q https://apt.llvm.org/llvm.sh && sudo bash llvm.sh "$LLVM_VERSION" all
      - name: Install CUDA (headers, libdevice, ptxas, nvlink, cudart; sets CUDA_PATH)
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '12.6.3'
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
          # clang's __clang_cuda_runtime_wrapper.h force-includes
          # curand_mtgp32_kernel.h, even when cuRAND isn't used.
          non-cuda-sub-packages: '["libcurand-dev"]'
      - name: Build ${{ matrix.target }}
        run: make -j$(nproc) CXX=$CXX ${{ matrix.make-args }} ${{ matrix.target }}
