# ffmt on JLSE GPUs. Each job builds and runs one id of test/configs.json
# with test/run_id.sh, on the batch queue that has the id's hardware; the
# id's setup script (test/setup/setup_<id>.sh) does the module loads and
# sets the compiler and flags. test/check_id.py then compares the results
# with the id's expected failures and decides pass or fail, so run_id.sh's
# own exit status (non-zero whenever any test fails) is ignored.

include:
  - project: 'ci-resources/defaults'
    ref: main
    file:
      - '/runners.yml'

stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.jlse-batch:
  extends: .batch-runner
  stage: test
  script:
    - test/run_id.sh $ID || true
    - python3 test/check_id.py $ID
  artifacts:
    when: always          # a failed run still leaves usable logs
    expire_in: 1 month
    paths:
      - results/

# icpx OpenMP offload to SPIR-V at -O0/-O2 (2, 3) and icpx SYCL at -O0/-O2
# (10, 11), on PVC.
chiatta:
  extends: .jlse-batch
  parallel:
    matrix: [{ID: [2, 3, 10, 11]}]
  variables:
    # runners.yml has per-queue templates (.ice-runner, .v100-runner, ...)
    # but none for chiatta, so set the queue here.
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 1:00:0 -q chiatta"

# clang CUDA at -O2/-O0 (4, 9) and clang OpenMP offload to NVPTX at -O0/-O2
# (5, 6), on A100.
a100:
  extends: .jlse-batch
  # gpu_a100 allows 2 jobs per user; run the A100 jobs one at a time.
  resource_group: a100
  parallel:
    matrix: [{ID: [4, 5, 6, 9]}]
  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 1:00:0 -q gpu_a100"

# ROCm clang OpenMP offload at -O0/-O2 (7, 8), on MI300X.
mi300x:
  extends: .jlse-batch
  parallel:
    matrix: [{ID: [7, 8]}]
  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 1:00:0 -q gpu_amd_mi300x"

# Expanded configurations run separately from the established gated jobs.
# New device IDs share a versioned runtime rather than a user checkout.
.jlse-extended:
  extends: .jlse-batch
  timeout: 4h
  variables:
    FFMT_RUNTIME_ROOT: /vast/projects/intel_anl_shared/ffmt-ci/releases/20261110-r1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false

.jlse-unqualified:
  extends: .jlse-extended
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false

# Fast-math DPC++ and Intel LLVM 7.2 produce crashes or empty main-suite output.
# Keep the affected targets visible without gating on empty output or waiving examples.
chiatta-dpcpp-unqualified:
  extends: .jlse-unqualified
  resource_group: chiatta
  parallel:
    matrix: [{ID: [14, 15, 16, 17, 64, 65, 82, 83]}]
  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 1:00:0 -q chiatta"

a100-extended:
  extends: .jlse-extended
  resource_group: a100
  parallel:
    matrix: [{ID: [18, 23]}]
  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 1:00:0 -q gpu_a100"

a100-omp-fast-math-unqualified:
  extends: .jlse-unqualified
  resource_group: a100
  parallel:
    matrix: [{ID: [19, 20]}]
  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 1:00:0 -q gpu_a100"

mi300x-omp-fast-math-unqualified:
