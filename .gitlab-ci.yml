table:
  stage: publish
  tags: [shell]           # no GPU needed
  when: always            # the table is most useful when something failed
  script:
    - ci/mktable.py results/*.json | tee results/table.md
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - results/table.md
