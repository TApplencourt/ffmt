# ffmt on real GPUs. .github/workflows/device.yml already checks that every
# backend compiles -- it says so itself, "there is no GPU to run on". This
# runs the same backends where a device exists.
#
# Each job is one call to ci/run.sh, which knows the Makefile variables for
# each backend and writes results/<backend>-<opt>.json via ci/tapsum.py.
#
# JLSE hardware and queues:
#   Intel PVC      chiatta
#   NVIDIA GB300   gpu_gb300
#   AMD MI300X     gpu_amd_mi300x
#
# Tags name the queue. If the runner lands on a login node rather than the
# node itself, prefix the run.sh line with that queue's batch submission.
# No HIP backend exists in the Makefile yet (issue #13 lists it as a TODO),
# so AMD runs AdaptiveCpp's generic target.

stages: [test, report]

default:
  artifacts:
    when: always          # a failing run still produces a usable row
    paths: [results/]

intel:sycl:
  stage: test
  tags: [chiatta]
  parallel:
    matrix: [{OPT: [O0, O2]}]
  script: [ci/run.sh icpx-sycl $OPT]

intel:omp:
  stage: test
  tags: [chiatta]
  parallel:
    matrix: [{OPT: [O0, O2]}]
  script: [ci/run.sh icpx-omp $OPT]

intel:acpp:
  stage: test
  tags: [chiatta]
  variables:
    ACPP_DEVICE: pvc
  script: [ci/run.sh acpp O2]

nvidia:cuda:
  stage: test
  tags: [gpu_gb300]
  script: [ci/run.sh clang-cuda O2]

nvidia:omp:
  stage: test
  tags: [gpu_gb300]
  parallel:
    matrix: [{OPT: [O0, O2]}]
  script: [ci/run.sh clang-omp-nvptx $OPT]

amd:acpp:
  stage: test
  tags: [gpu_amd_mi300x]
  variables:
    ACPP_DEVICE: mi300x
  script: [ci/run.sh acpp O2]

table:
  stage: report
  tags: [chiatta]
  when: always            # the table is most useful when something failed
  script: [ci/mktable.py results/*.json | tee results/table.md]
  artifacts:
    when: always
    paths: [results/table.md]
