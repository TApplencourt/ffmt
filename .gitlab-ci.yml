# ffmt on JLSE GPUs. Each job runs its IDs sequentially in one allocation
# through test/run_ids.sh. Each ID gets a fresh test/run_id.sh process and
# independent results; test/check_id.py decides its status after comparing
# complete artifacts with test/configs.json. A failed check does not skip
# later IDs, and the batch fails only after every ID has run.

include:
  - project: 'ci-resources/defaults'
    ref: main
    file:
      - '/runners.yml'

stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.jlse-batch:
  extends: .batch-runner
  stage: test
  script:
    - test/run_ids.sh $IDS
  artifacts:
    when: always          # a failed run still leaves usable logs
    expire_in: 1 month
    paths:
      - results/

# icpx OpenMP offload to SPIR-V at -O0/-O2 (2, 3) and icpx SYCL at -O0/-O2
# (10, 11), on PVC.
chiatta:
  extends: .jlse-batch
  variables:
    IDS: "2 3 10 11"
    # runners.yml has per-queue templates (.ice-runner, .v100-runner, ...)
    # but none for chiatta, so set the queue here.
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 0:45:0 -q chiatta"

# clang CUDA at -O2/-O0 (4, 9) and clang OpenMP offload to NVPTX at -O0/-O2
# (5, 6), on A100.
a100:
  extends: .jlse-batch
  resource_group: a100
  variables:
    IDS: "4 5 6 9"
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 0:45:0 -q gpu_a100"

# ROCm clang OpenMP offload at -O0/-O2 (7, 8), on MI300X.
mi300x:
  extends: .jlse-batch
  variables:
    IDS: "7 8"
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 0:20:0 -q gpu_amd_mi300x"

# Expanded configurations run separately from the established gated jobs.
# New device IDs share a versioned runtime rather than a user checkout.
.jlse-extended:
  extends: .jlse-batch
  # GitLab time includes Cobalt waits on single-node queues.
  timeout: 24h
  variables:
    FFMT_RUNTIME_ROOT: /vast/projects/intel_anl_shared/ffmt-ci/releases/20261110-r1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false

.jlse-unqualified:
  extends: .jlse-extended
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false

# Fast-math DPC++ and Intel LLVM 7.2 produce crashes or empty main-suite output.
# Keep the affected targets visible without gating on empty output or waiving examples.
chiatta-dpcpp-unqualified:
  extends: .jlse-unqualified
  resource_group: chiatta
  variables:
    IDS: "14 15 16 17 64 65 82 83"
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 1:00:0 -q chiatta"

a100-extended:
  extends: .jlse-extended
  resource_group: a100
  variables:
    IDS: "18 23"
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 0:30:0 -q gpu_a100"

a100-omp-fast-math-unqualified:
  extends: .jlse-unqualified
  resource_group: a100
  variables:
    IDS: "19 20"
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 0:30:0 -q gpu_a100"

mi300x-omp-fast-math-unqualified:
