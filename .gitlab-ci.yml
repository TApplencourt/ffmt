  resource_group: gh200
  variables:
    IDS: "52 53 58 59 62 63 68 69"
    PYTHON: /usr/bin/python3.12
    # Eight measured runs fit within two hours, including slow NVCC diagnostics.
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 2:00:0 -q gpu_gh200"

