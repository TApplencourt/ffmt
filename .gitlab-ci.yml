# ffmt on JLSE GPUs. The GitHub workflows check that every backend compiles
# -- "there is no GPU to run on" -- so this runs them where a device exists.
#
# Each job is one ci/run.sh invocation on a batch runner, with the queue
# naming the hardware. ci/tapsum.py writes results/<backend>-<opt>.json and
# the table job collects them.

stages:
  - test
  - publish

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.jlse-batch:
  stage: test
  tags: [batch]
  artifacts:
    when: always          # a failed run still produces a usable row
    expire_in: 1 month
    paths:
      - results/

chiatta:sycl:
  extends: .jlse-batch
  parallel:
    matrix: [{OPT: [O0, O2]}]
  variables:
    # Best guess at the variable the jlsebatch runners read: ALCF's Aurora
    # template uses ANL_AURORA_SCHEDULER_PARAMETERS, so set the JLSE-prefixed
    # and bare names together until one is confirmed. Cobalt syntax, not PBS.
    ANL_JLSE_SCHEDULER_PARAMETERS: "-q chiatta -t 1:00:0 -n 1"
    SCHEDULER_PARAMETERS: "-q chiatta -t 1:00:0 -n 1"
  script:
    - ci/run.sh sycl $OPT

