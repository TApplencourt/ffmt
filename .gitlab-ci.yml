  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 1:00:0 -q gpu_amd_mi300x"

# The baseline header does not yet tag native HIP entry points FMT_HD. Keep
# these total-build failures visible without waiving them or changing library code.
