# ffmt on JLSE GPUs. Each job runs its ids, the rows of test/configs.json
# whose `ci` is jlse:<job name>, one after another in one allocation through
# test/run_ids.sh: test/run_id.sh records what each id
# does, then test/check_id.py compares them all with test/configs.json and
# decides. The results/ artifact of a job, unpacked in a checkout, is what
# test/check_id.py reads: to review a run and accept it locally
# (--accept-and-update-config).
#
# h100-extended is an optional manual job because a gpu_h100 node can take
# hours to get. An untriggered pipeline passes with the other 50 ids. After
# H100 finishes, retry jlse-summary, then jlse-wiki, for the full 56-id report;
# completed downstream jobs do not rerun automatically.
#
# GitLab's existing pull mirror imports every GitHub branch, but only a
# default-branch push may launch hardware. GitHub Actions can request a
# mirrored ref through a trigger pipeline; RUN_H100=true makes H100 required.

include:
  - project: 'ci-resources/defaults'
    ref: main
    file:
      - '/runners.yml'

stages:
  - test
  - report

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

.jlse-batch:
  extends: .batch-runner
  stage: test
  # GitLab time includes Cobalt waits on single-node queues.
  timeout: 24h
  variables:
    FFMT_RUNTIME_ROOT: /vast/projects/intel_anl_shared/ffmt-ci/releases/20261110-r1
  script:
    - test/run_ids.sh $(${PYTHON:-python3} test/check_id.py --list "jlse:$CI_JOB_NAME")
  artifacts:
    when: always          # a failed run still leaves usable logs
    expire_in: 1 month
    paths:
      - results/

# One job per node type: every id of a queue in one allocation.

# icpx OpenMP and SYCL, Intel LLVM SYCL, Kokkos SYCL and chipStar, on PVC.
chiatta:
  extends: .jlse-batch
  resource_group: chiatta
  variables:
    # runners.yml has per-queue templates (.ice-runner, .v100-runner, ...)
    # but none for chiatta, so set the queue here. 2:00 is its maximum.
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 2:00:0 -q chiatta"

# clang CUDA and clang OpenMP offload to NVPTX, on A100.
a100:
  extends: .jlse-batch
  resource_group: a100
  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 1:45:0 -q gpu_a100"

# ROCm clang OpenMP, native HIP, Kokkos HIP and AdaptiveCpp, on MI300X.
mi300x:
  extends: .jlse-batch
  resource_group: mi300x
  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 3:35:0 -q gpu_amd_mi300x"

# This results marker makes an attempted H100 run visible to a retried summary,
# including a failed run whose per-id artifacts are incomplete.
h100-extended:
  extends: .jlse-batch
  resource_group: h100
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $RUN_H100 == "true"'
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true
  script:
    - mkdir -p results
    - touch results/h100-extended.attempted
    - test/run_ids.sh $(${PYTHON:-python3} test/check_id.py --list "jlse:$CI_JOB_NAME")
  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 0:45:0 -q gpu_h100"

# Kokkos CUDA and AdaptiveCpp, on A40.
a40:
  extends: .jlse-batch
  resource_group: a40
  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 2:45:0 -q gpu_a40"

gh200-extended:
  extends: .jlse-batch
  resource_group: gh200
  variables:
    PYTHON: /usr/bin/python3.12
    # Eight measured runs fit within two hours, including slow NVCC diagnostics.
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 2:00:0 -q gpu_gh200"

rome-extended:
  extends: .jlse-batch
  resource_group: rome
  variables:
    JLSE_SCHEDULER_PARAMETERS: "-n 1 -t 0:30:0 -q rome_7742"

# One table of every id: each job's results/id-<id>/summary.md, which GitLab
# puts back in place from the previous stage. Do not add needs:optional for the
# manual H100 job: GitLab then starts this job before the required artifacts are
# ready. Default stage ordering also downloads H100 artifacts on a later retry.
jlse-summary:
  extends: .shell-runner
  stage: report
  rules:
    - when: always
  script:
    - set +e
    - mkdir -p results
    - summary_ids=
    - h100_ids=" $(python3 test/check_id.py --list jlse:h100-extended) "
    - |
      for id in $(python3 test/check_id.py --list jlse:); do
        case "$h100_ids" in
          *" $id "*)
            # Omit H100 only before its optional job has been attempted.
            [ -f results/h100-extended.attempted ] && summary_ids="$summary_ids $id" ;;
          *) summary_ids="$summary_ids $id" ;;
        esac
      done
    - python3 test/check_id.py --table $summary_ids > results/jlse-summary.md
    - summary_status=$?
    - cat results/jlse-summary.md
    - exit "$summary_status"
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - results/jlse-summary.md

# Use a masked Developer project access token with only the api scope. This job
# is intentionally absent from MR pipelines, which must not receive the token.
jlse-wiki:
  extends: .shell-runner
  stage: report
  needs:
    - {job: jlse-summary, artifacts: true}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
      when: always
  script:
    - python3 test/publish_jlse_wiki.py results/jlse-summary.md
